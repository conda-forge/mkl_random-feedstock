{% set version = "1.6.0" %}

package:
  name: mkl_random
  version: {{ version }}

source:
  url: https://github.com/IntelPython/mkl_random/archive/{{ version }}.tar.gz
  sha256: 0c900743ad5641b69054f8c07dcd03f503c9167b31890eb14da108ae8e9fbce7

build:
  number: 1
  ignore_run_exports:
    - blas

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - python
    - meson-python >=0.16.0
    - meson >=1.8.3
    - mkl-devel
    - cython >=3.1.0
    - numpy
    - pip
  run:
    - python
    - numpy >=1.26.4

test:
  commands:
    - pip check
    - pytest -v --pyargs mkl_random
  requires:
    - pip
    - pytest
  imports:
    - mkl_random
    - mkl_random.mklrand

about:
  home: http://github.com/IntelPython/mkl_random
  license: BSD-3-Clause
  license_file: LICENSE.txt
  description: NumPy-based implementation of random number generation sampling using Intel (R) Math Kernel Library, mirroring numpy.random, but exposing all choices of sampling algorithms available in MKL.
  summary: Intel (R) MKL-powered package for sampling from common probability distributions into NumPy arrays.


extra:
  recipe-maintainers:
    - antonwolfy
    - ekomarova
    - ndgrigorian
    - xaleryb
    - jharlow-intel
